
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>UMBRA LIFE SUPPORT</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            min-height: 100%;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background:
                radial-gradient(circle at center, #17202b 0%, #080b10 55%, #030406 100%);
            color: #d8e0e8;
            overflow-x: hidden;
        }

        /* subtle technical grid */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
        }

        .app {
            position: relative;
            z-index: 1;
            width: min(1100px, 92%);
            margin: 0 auto;
            padding: 60px 0 30px;
        }

        /* HEADER */

        header {
            text-align: center;
            margin-bottom: 50px;
        }

        .eyebrow {
            font-size: 12px;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: #7f91a3;
            margin-bottom: 14px;
        }

        h1 {
            font-size: clamp(42px, 8vw, 76px);
            letter-spacing: 12px;
            font-weight: 300;
            color: #eef3f7;
        }

        .subtitle {
            margin-top: 8px;
            font-size: 14px;
            letter-spacing: 8px;
            text-transform: uppercase;
            color: #8797a8;
        }

        /* SYSTEM CORE */

        .core-area {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 10px 0 65px;
        }

        .system-core {
            position: relative;
            width: 250px;
            height: 250px;
            border-radius: 50%;

            display: flex;
            justify-content: center;
            align-items: center;

            background:
                radial-gradient(
                    circle,
                    rgba(75, 100, 120, 0.16) 0%,
                    rgba(15, 20, 27, 0.8) 55%,
                    rgba(3, 5, 8, 0.98) 100%
                );

            border: 1px solid rgba(170, 190, 210, 0.22);

            box-shadow:
                0 0 35px rgba(100, 140, 170, 0.08),
                inset 0 0 35px rgba(100, 140, 170, 0.05);
        }

        /* outer rotating technical ring */

        .system-core::after {
            content: "";
            position: absolute;
            inset: -14px;
            border-radius: 50%;
            border: 1px solid rgba(130, 160, 185, 0.18);
            border-top-color: rgba(190, 210, 225, 0.65);
            animation: rotateRing 14s linear infinite;
        }

        /* soft pulse */

        .system-core::before {
            content: "";
            position: absolute;
            inset: -5px;
            border-radius: 50%;
            border: 1px solid rgba(150, 180, 200, 0.16);
            animation: pulse 3.5s ease-in-out infinite;
        }

        .core-content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .umbra-crest {
            width: 125px;
            height: 125px;
            object-fit: contain;

            filter:
                drop-shadow(0 0 8px rgba(150, 180, 205, 0.20))
                drop-shadow(0 0 20px rgba(100, 140, 170, 0.10));

            opacity: 0.94;

            animation: crestPulse 5s ease-in-out infinite;
        }

        .system-status {
            margin-top: 9px;
            font-size: 10px;
            letter-spacing: 4px;
            color: #7f91a3;
        }

        .online {
            margin-top: 5px;
            font-size: 11px;
            letter-spacing: 3px;
            color: #c5d2dc;
        }

        /* MODULES */

        .modules-title {
            text-align: center;
            font-size: 11px;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: #718292;
            margin-bottom: 22px;
        }

        .modules {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
        }

        .module {
            position: relative;
            min-height: 155px;
            padding: 25px;

            background: rgba(10, 14, 19, 0.72);
            border: 1px solid rgba(160, 180, 200, 0.12);

            transition:
                border-color 0.25s ease,
                transform 0.25s ease,
                background 0.25s ease;

            overflow: hidden;
        }

        .module::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 35px;
            height: 1px;
            background: rgba(180, 200, 215, 0.55);
        }

        .module:hover {
            transform: translateY(-3px);
            border-color: rgba(180, 200, 215, 0.28);
            background: rgba(18, 24, 31, 0.82);
        }

        .module-number {
            font-size: 10px;
            letter-spacing: 3px;
            color: #657585;
            margin-bottom: 14px;
        }

        .module h2 {
            font-size: 17px;
            letter-spacing: 2px;
            font-weight: 400;
            color: #e1e7ec;
            margin-bottom: 12px;
        }

        .module p {
            font-size: 13px;
            line-height: 1.6;
            color: #7e8d9c;
        }

        /* FOOTER */

        footer {
            text-align: center;
            margin-top: 55px;
            padding-top: 20px;
            border-top: 1px solid rgba(160, 180, 200, 0.08);

            font-size: 10px;
            letter-spacing: 3px;
            color: #566574;
        }

        /* ANIMATIONS */

        @keyframes rotateRing {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        @keyframes pulse {
            0%,
            100% {
                opacity: 0.25;
                transform: scale(1);
            }

            50% {
                opacity: 0.7;
                transform: scale(1.025);
            }
        }

        @keyframes crestPulse {
            0%,
            100% {
                opacity: 0.88;
                transform: scale(1);
            }

            50% {
                opacity: 1;
                transform: scale(1.025);
            }
        }

        /* MOBILE */

        @media (max-width: 700px) {

            .app {
                padding-top: 40px;
            }

            header {
                margin-bottom: 40px;
            }

            h1 {
                letter-spacing: 7px;
            }

            .subtitle {
                letter-spacing: 5px;
            }

            .system-core {
                width: 215px;
                height: 215px;
            }

            .umbra-crest {
                width: 105px;
                height: 105px;
            }

            .modules {
                grid-template-columns: 1fr;
            }

            .module {
                min-height: 135px;
            }
        }

        @media (max-width: 420px) {

            .app {
                width: 88%;
            }

            h1 {
                font-size: 38px;
                letter-spacing: 5px;
            }

            .subtitle {
                font-size: 11px;
                letter-spacing: 4px;
            }

            .system-core {
                width: 195px;
                height: 195px;
            }

            .umbra-crest {
                width: 95px;
                height: 95px;
            }
        }
    </style>
</head>

<body>

    <div class="app">

        <header>
            <div class="eyebrow">Personal Utility System</div>
            <h1>UMBRA</h1>
            <div class="subtitle">Life Support</div>
        </header>


        <section class="core-area">

            <div class="system-core">

                <div class="core-content">

                    <img
                        class="umbra-crest"
                        src="umbra_genetics_wappen_gross.png"
                        alt="UMBRA crest"
                    >

                    <div class="system-status">
                        SYSTEM
                    </div>

                    <div class="online">
                        ONLINE
                    </div>

                </div>

            </div>

        </section>


        <div class="modules-title">
            Modules
        </div>


        <section class="modules">

            <article class="module">

                <div class="module-number">
                    MODULE 01
                </div>

                <h2>
                    AC CALCULATOR
                </h2>

                <p>
                    Air conditioning calculations and useful climate utilities.
                </p>

            </article>


            <article class="module">

                <div class="module-number">
                    MODULE 02
                </div>

                <h2>
                    RESERVED
                </h2>

                <p>
                    Future utility module.
                </p>

            </article>


            <article class="module">

                <div class="module-number">
                    MODULE 03
                </div>

                <h2>
                    RESERVED
                </h2>

                <p>
                    Future utility module.
                </p>

            </article>

        </section>


        <footer>
            UMBRA LIFE SUPPORT · SYSTEM ONLINE
        </footer>

    </div>

</body>
</html>
