
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>UMBRA LIFE SUPPORT</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            min-height: 100%;
        }

        body {
            background:
                radial-gradient(circle at 50% 35%, #18202b 0%, #0b0f14 42%, #05070a 100%);
            color: #d8dee7;
            font-family: "Segoe UI", Arial, sans-serif;
            overflow-x: hidden;
        }

        /* subtle background grid */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            opacity: 0.12;

            background-image:
                linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);

            background-size: 50px 50px;
        }

        .app {
            position: relative;
            z-index: 1;

            width: min(1100px, 92%);
            margin: 0 auto;
            padding: 70px 0 60px;
        }

        /* HEADER */

        .header {
            text-align: center;
            margin-bottom: 55px;
        }

        .eyebrow {
            font-size: 12px;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: #718092;
            margin-bottom: 16px;
        }

        h1 {
            font-size: clamp(38px, 7vw, 72px);
            font-weight: 300;
            letter-spacing: 8px;
            color: #f0f3f7;
            text-shadow: 0 0 30px rgba(130, 170, 220, 0.18);
        }

        .subtitle {
            margin-top: 18px;
            font-size: 13px;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #667382;
        }

        /* CENTRAL SYSTEM */

        .system-core {
            width: 240px;
            height: 240px;
            margin: 0 auto 65px;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                radial-gradient(circle,
                    rgba(110, 145, 180, 0.24) 0%,
                    rgba(50, 70, 90, 0.08) 38%,
                    transparent 70%);

            border: 1px solid rgba(130, 160, 190, 0.18);

            box-shadow:
                0 0 35px rgba(100, 140, 180, 0.08),
                inset 0 0 45px rgba(100, 140, 180, 0.05);

            position: relative;
        }

        .system-core::before {
            content: "";
            position: absolute;
            width: 155px;
            height: 155px;

            border-radius: 50%;

            border: 1px solid rgba(150, 180, 210, 0.20);

            animation: pulse 4s ease-in-out infinite;
        }

        .system-core::after {
            content: "";
            position: absolute;
            width: 90px;
            height: 90px;

            border-radius: 50%;

            border: 1px solid rgba(180, 200, 220, 0.28);
            box-shadow:
                0 0 25px rgba(120, 160, 200, 0.12);

            animation: rotate 18s linear infinite;
        }

        .core-label {
            position: relative;
            z-index: 2;

            text-align: center;
            font-size: 11px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #aeb9c5;
        }

        .core-status {
            margin-top: 8px;
            color: #7f9aaf;
            font-size: 10px;
            letter-spacing: 2px;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(0.94);
                opacity: 0.55;
            }

            50% {
                transform: scale(1.04);
                opacity: 1;
            }
        }

        @keyframes rotate {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        /* MODULES */

        .section-title {
            text-align: center;
            font-size: 11px;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: #596675;
            margin-bottom: 24px;
        }

        .modules {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 18px;
        }

        .module {
            min-height: 145px;
            padding: 25px;

            background: rgba(13, 18, 24, 0.72);
            border: 1px solid rgba(150, 170, 190, 0.12);
            border-radius: 10px;

            transition:
                transform 0.25s ease,
                border-color 0.25s ease,
                background 0.25s ease;

            cursor: pointer;
        }

        .module:hover {
            transform: translateY(-3px);
            border-color: rgba(150, 180, 210, 0.28);
            background: rgba(20, 27, 35, 0.85);
        }

        .module-number {
            font-size: 10px;
            letter-spacing: 3px;
            color: #566575;
            margin-bottom: 20px;
        }

        .module h2 {
            font-size: 20px;
            font-weight: 400;
            letter-spacing: 2px;
            color: #dfe5eb;
            margin-bottom: 10px;
        }

        .module p {
            font-size: 12px;
            line-height: 1.6;
            color: #697685;
        }

        .module.disabled {
            opacity: 0.48;
            cursor: default;
        }

        .module.disabled:hover {
            transform: none;
            border-color: rgba(150, 170, 190, 0.12);
            background: rgba(13, 18, 24, 0.72);
        }

        /* FOOTER */

        footer {
            margin-top: 65px;
            text-align: center;
            font-size: 10px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #3f4b57;
        }

        /* MOBILE */

        @media (max-width: 600px) {

            .app {
                padding-top: 45px;
            }

            h1 {
                letter-spacing: 5px;
            }

            .system-core {
                width: 200px;
                height: 200px;
            }

            .modules {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <main class="app">

        <header class="header">

            <div class="eyebrow">
                Personal Utility System
            </div>

            <h1>
                UMBRA
            </h1>

            <div class="subtitle">
                Life Support
            </div>

        </header>


        <section class="system-core">

            <div class="core-label">

                SYSTEM

                <div class="core-status">
                    ONLINE
                </div>

            </div>

        </section>


        <section>

            <div class="section-title">
                Modules
            </div>

            <div class="modules">

                <div class="module">

                    <div class="module-number">
                        MODULE 01
                    </div>

                    <h2>
                        AC CALCULATOR
                    </h2>

                    <p>
                        Air conditioning calculations and useful climate utilities.
                    </p>

                </div>


                <div class="module disabled">

                    <div class="module-number">
                        MODULE 02
                    </div>

                    <h2>
                        RESERVED
                    </h2>

                    <p>
                        Future utility module.
                    </p>

                </div>


                <div class="module disabled">

                    <div class="module-number">
                        MODULE 03
                    </div>

                    <h2>
                        RESERVED
                    </h2>

                    <p>
                        Future utility module.
                    </p>

                </div>

            </div>

        </section>


        <footer>
            UMBRA LIFE SUPPORT · SYSTEM ONLINE
        </footer>

    </main>

</body>
</html>
