<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UMBRA LIFE SUPPORT</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    min-height: 100%;
    background: #05070a;
    color: #c8d1d8;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    min-height: 100vh;
    overflow-x: hidden;
    background:
        radial-gradient(circle at center, #111820 0%, #080b10 45%, #030507 100%);
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.16;
    background-image:
        linear-gradient(rgba(120,150,170,.12) 1px, transparent 1px),
        linear-gradient(90deg, rgba(120,150,170,.12) 1px, transparent 1px);
    background-size: 40px 40px;
}

.app {
    width: min(1100px, 94vw);
    margin: 0 auto;
    padding: 42px 0 70px;
    position: relative;
    z-index: 1;
}

/* HEADER */

.header {
    text-align: center;
    margin-bottom: 38px;
}

.header h1 {
    margin: 0;
    font-size: 32px;
    font-weight: 300;
    letter-spacing: 12px;
    color: #dce5eb;
}

.header .subtitle {
    margin-top: 10px;
    font-size: 10px;
    letter-spacing: 5px;
    color: #65747f;
}

/* CORE */

.core-area {
    display: flex;
    flex-direction: column;
    align-items: center;
}

.core {
    width: 190px;
    height: 190px;
    border-radius: 50%;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
}

.core::before {
    content: "";
    position: absolute;
    inset: 8px;
    border-radius: 50%;
    border: 1px solid rgba(120, 145, 160, .24);
    box-shadow:
        0 0 35px rgba(70, 180, 130, .08),
        inset 0 0 30px rgba(0, 0, 0, .8);
}

.core::after {
    content: "";
    position: absolute;
    inset: -8px;
    border-radius: 50%;
    border: 1px solid rgba(110, 130, 145, .13);
    animation: pulse 4s ease-in-out infinite;
}

.outer-ring {
    position: absolute;
    inset: -18px;
    border-radius: 50%;
    border: 1px dashed rgba(110, 135, 150, .18);
    animation: rotate 28s linear infinite;
}

.outer-ring::before,
.outer-ring::after {
    content: "";
    position: absolute;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #58706a;
    box-shadow: 0 0 12px rgba(85, 214, 122, .35);
}

.outer-ring::before {
    top: 8px;
    left: 50%;
    transform: translateX(-50%);
}

.outer-ring::after {
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
}

.core-image {
    width: 115px;
    height: 115px;
    object-fit: contain;
    opacity: .92;
    filter: drop-shadow(0 0 18px rgba(100, 150, 170, .12));
}

.online {
    margin-top: 24px;
    font-size: 10px;
    letter-spacing: 5px;
    color: #55d67a;
    text-shadow: 0 0 10px rgba(85, 214, 122, .18);
}

/* BUTTONS */

.system-controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    margin-top: 25px;
}

.system-button {
    border: 1px solid rgba(150, 175, 190, .22);
    background: rgba(8, 12, 16, .86);
    color: #9eacb6;
    padding: 12px 22px;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 10px;
    letter-spacing: 3px;
    cursor: pointer;
    transition: .2s ease;
}

.system-button:hover {
    border-color: rgba(180, 200, 215, .45);
    color: #d8e0e5;
    background: rgba(15, 22, 28, .95);
}

.start-button {
    color: #55d67a;
    border-color: rgba(85, 214, 122, .30);
}

.start-button:hover {
    color: #75ed98;
    border-color: rgba(85, 214, 122, .65);
    box-shadow: 0 0 18px rgba(85, 214, 122, .08);
}

.exit-button {
    color: #a77777;
    border-color: rgba(170, 100, 100, .25);
}

.exit-button:hover {
    color: #d09090;
    border-color: rgba(190, 110, 110, .55);
}

/* MODULE HOME */

#moduleHome {
    display: none;
    margin-top: 58px;
}

.modules-reveal {
    animation: modulesReveal .7s ease-out both;
}

.modules-title {
    text-align: center;
    margin-bottom: 24px;
    font-size: 9px;
    letter-spacing: 4px;
    color: #586872;
}

.modules {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
}

.module {
    min-height: 155px;
    padding: 24px 22px;
    background:
        linear-gradient(145deg, rgba(18, 25, 31, .92), rgba(7, 10, 14, .96));
    border: 1px solid rgba(130, 155, 170, .16);
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: .25s ease;
}

.module::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 2px;
    background: rgba(85, 214, 122, .28);
}

.module:hover {
    transform: translateY(-3px);
    border-color: rgba(150, 180, 195, .32);
    box-shadow: 0 12px 35px rgba(0, 0, 0, .3);
}

.module-number {
    font-size: 9px;
    letter-spacing: 3px;
    color: #566672;
    margin-bottom: 16px;
}

.module-name {
    font-size: 15px;
    letter-spacing: 3px;
    color: #b9c6ce;
    margin-bottom: 14px;
}

.module-status {
    font-size: 9px;
    letter-spacing: 2px;
    color: #64737d;
}

.module-status.ready {
    color: #55d67a;
}

/* PANELS */

.module-panel {
    display: none;
    margin-top: 50px;
    animation: panelIn .45s ease-out both;
}

.panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    padding-bottom: 15px;
    border-bottom: 1px solid rgba(130, 155, 170, .14);
}

.panel-title {
    font-size: 15px;
    letter-spacing: 4px;
    color: #c7d2d9;
}

.panel-code {
    margin-top: 6px;
    font-size: 9px;
    letter-spacing: 3px;
    color: #586873;
}

.back-button {
    border: 1px solid rgba(130, 155, 170, .18);
    background: rgba(8, 12, 16, .82);
    color: #81909a;
    padding: 10px 16px;
    font-size: 9px;
    letter-spacing: 2px;
    cursor: pointer;
}

.back-button:hover {
    color: #c6d0d6;
    border-color: rgba(160, 185, 200, .35);
}

/* CALCULATOR */

.calculator-panel {
    max-width: 760px;
    margin: 30px auto 0;
    padding: 28px;
    background: rgba(8, 12, 16, .74);
    border: 1px solid rgba(130, 155, 170, .14);
}

.calc-intro {
    text-align: center;
    margin-bottom: 30px;
}

.calc-intro-title {
    font-size: 10px;
    letter-spacing: 4px;
    color: #55d67a;
    margin-bottom: 11px;
}

.calc-intro-text {
    font-size: 10px;
    letter-spacing: 1px;
    color: #65747e;
}

.calc-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 18px;
}

.calc-field {
    display: flex;
    flex-direction: column;
}

.calc-field label {
    margin-bottom: 9px;
    font-size: 9px;
    letter-spacing: 2px;
    color: #74838d;
}

.calc-field input {
    width: 100%;
    padding: 14px 13px;
    border: 1px solid rgba(130, 155, 170, .18);
    outline: none;
    background: rgba(3, 6, 9, .9);
    color: #d1dbe1;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 15px;
}

.calc-field input:focus {
    border-color: rgba(85, 214, 122, .42);
    box-shadow: 0 0 14px rgba(85, 214, 122, .05);
}

.calc-field input::placeholder {
    color: #36434c;
}

.calc-action {
    display: flex;
    justify-content: center;
    margin: 28px 0;
}

.calculate-button {
    min-width: 210px;
    padding: 14px 22px;
    border: 1px solid rgba(85, 214, 122, .35);
    background: rgba(10, 20, 15, .9);
    color: #55d67a;
    font-size: 10px;
    letter-spacing: 3px;
    cursor: pointer;
    transition: .2s ease;
}

.calculate-button:hover {
    border-color: rgba(85, 214, 122, .7);
    box-shadow: 0 0 20px rgba(85, 214, 122, .08);
}

.calc-results {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 11px;
}

.result-box {
    padding: 20px 12px;
    text-align: center;
    background: rgba(5, 9, 12, .85);
    border: 1px solid rgba(130, 155, 170, .12);
}

.result-label {
    font-size: 8px;
    letter-spacing: 2px;
    color: #596a75;
    margin-bottom: 11px;
}

.result-value {
    font-size: 20px;
    color: #cbd6dc;
    letter-spacing: 1px;
}

.result-unit {
    margin-top: 6px;
    font-size: 8px;
    letter-spacing: 1px;
    color: #5f707a;
}

.calculator-note {
    margin-top: 19px;
    text-align: center;
    font-size: 8px;
    letter-spacing: 1px;
    color: #46545d;
}

/* REPLICATOR */

.replicator-panel {
    max-width: 800px;
    margin: 30px auto 0;
}

.replicator-status {
    text-align: center;
    margin-bottom: 18px;
    padding: 14px;
    border: 1px solid rgba(85, 214, 122, .14);
    background: rgba(8, 15, 11, .55);
    color: #55d67a;
    font-size: 9px;
    letter-spacing: 3px;
}

.food-list {
    max-height: 470px;
    overflow-y: auto;
    padding-right: 5px;
}

.food-list::-webkit-scrollbar {
    width: 5px;
}

.food-list::-webkit-scrollbar-track {
    background: rgba(255,255,255,.02);
}

.food-list::-webkit-scrollbar-thumb {
    background: rgba(130,155,170,.25);
}

.food-category {
    margin: 22px 0 9px;
    padding-bottom: 7px;
    border-bottom: 1px solid rgba(130,155,170,.12);
    font-size: 9px;
    letter-spacing: 3px;
    color: #667781;
}

.food-item {
    display: grid;
    grid-template-columns: 1fr 110px 100px;
    gap: 10px;
    align-items: center;
    padding: 13px 12px;
    margin-bottom: 5px;
    background: rgba(9, 13, 17, .75);
    border: 1px solid rgba(130,155,170,.09);
    cursor: pointer;
    transition: .18s ease;
}

.food-item:hover,
.food-item.active {
    border-color: rgba(85,214,122,.28);
    background: rgba(12, 20, 16, .9);
}

.food-name {
    font-size: 10px;
    color: #aebbc3;
    letter-spacing: 1px;
}

.food-temp,
.food-time {
    text-align: right;
    font-size: 9px;
    color: #71818b;
    letter-spacing: 1px;
}

.food-item.active .food-name,
.food-item.active .food-temp,
.food-item.active .food-time {
    color: #55d67a;
}

.module-exit {
    margin-top: 28px;
}

/* MOBILE */

@media (max-width: 700px) {

    .app {
        width: 92vw;
        padding-top: 28px;
    }

    .header h1 {
        font-size: 24px;
        letter-spacing: 8px;
    }

    .modules {
        grid-template-columns: 1fr;
    }

    .calc-grid {
        grid-template-columns: 1fr;
    }

    .calc-results {
        grid-template-columns: 1fr;
    }

    .calculator-panel {
        padding: 19px;
    }

    .food-item {
        grid-template-columns: 1fr 75px 75px;
    }

    .food-name {
        font-size: 9px;
    }

    .food-temp,
    .food-time {
        font-size: 8px;
    }
}

@keyframes rotate {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

@keyframes pulse {
    0%, 100% {
        transform: scale(1);
        opacity: .45;
    }

    50% {
        transform: scale(1.04);
        opacity: .9;
    }
}

@keyframes modulesReveal {
    from {
        opacity: 0;
        transform: translateY(18px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes panelIn {
    from {
        opacity: 0;
        transform: translateY(10px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}
</style>

</head>
